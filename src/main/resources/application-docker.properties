## Ativação condicional deste arquivo quando o profile 'docker' estiver ativo
spring.config.activate.on-profile=docker

# Nome da aplicação
spring.application.name=user-service

# Datasource - quando rodando via docker-compose o serviço Postgres costuma se chamar 'postgres'
spring.datasource.url=jdbc:postgresql://postgres:5432/userservice_db
spring.datasource.username=userservice
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
#spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# URL do servico de usuário / integrações
user.service.url=http://localhost:8081

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
spring.main.allow-bean-definition-overriding=true

# JWT
security.jwt.secret=${SECURITY_JWT_SECRET:}
jwt.secret=${JWT_SECRET:dev-secret-change-me}
# 2 horas
jwt.expiration-ms=7200000

# 30 minutos
### jwt.expiration-ms=1800000

# 15 minutos
#### jwt.expiration-ms=900000

# usuário simples para testes
spring.security.user.name=fiap
spring.security.user.password=fiap2025

# logs Flyway para DEBUG para facilitar o diagnóstico (se reativar Flyway)
logging.level.com.fiap=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
logging.level.org.flywaydb.core=DEBUG
logging.level.org.flywaydb=DEBUG