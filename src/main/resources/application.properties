spring.application.name=user-service

# Configuracoes do banco de dados - usando o banco criado pelo init.sql (userservice_db)
spring.datasource.url=jdbc:postgresql://localhost:5432/userservice_db
spring.datasource.username=userservice
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
# Desabilita Flyway temporariamente (workaround)
#spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.connect-retries=5
logging.level.org.flywaydb=DEBUG
logging.level.org.flywaydb.core=DEBUG
# spring.flyway.validate-on-migrate=true  # Habilitar as migrations cobrirem todo o schema

# Configuracoes de logging
logging.level.com.fiap=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# /api-docs endpoint custom path
springdoc.api-docs.path=/api-doc

# URL do servico de user (integração) - variável para facilitar ambiente docker/compose
user.service.url=${USER_SERVICE_URL:http://localhost:8081}

# JWT
jwt.secret=${JWT_SECRET:dev-secret-change-me}
jwt.expiration-ms=3600000

# usuário simples para testes (somente para dev)
spring.security.user.name=fiap
spring.security.user.password=fiap2025

# Spring Boot
spring.main.allow-bean-definition-overriding=true